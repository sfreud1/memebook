[package]
name = "memebook"
version = "0.1.0"
description = "Fixed-term, oracle-free, liquidation-free P2P lending for long-tail SPL tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memebook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "token_2022", "associated_token"] }
